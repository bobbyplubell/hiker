[package]
name = "diff-overlay-snapshot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "diff-overlay-snapshot"
path = "src/main.rs"

[features]
default = []
# Screenshot rendering is OPT-IN. `egui_kittest` is built on `accesskit`, which
# turns on `egui/accesskit` and breaks `hiker-app`'s `egui-winit` (E0027) via
# feature unification — so it must stay out of the default / `--workspace`
# build. The text report works without it; build with `--features screenshot`
# (which compiles only this tool, not hiker-app) to also emit PNGs.
screenshot = ["dep:egui", "dep:egui_kittest", "dep:editor-view", "dep:editor-egui"]

[dependencies]
hiker-core = { path = "../../core" }
editor-core = { path = "../../editor/editor-core" }
editor-diff = { path = "../../editor/editor-diff" }
smol_str.workspace = true
anyhow.workspace = true
tempfile = "3"

# screenshot-only (see [features].screenshot)
egui = { workspace = true, optional = true }
egui_kittest = { version = "0.32", default-features = false, features = ["wgpu"], optional = true }
editor-view = { path = "../../editor/editor-view", optional = true }
editor-egui = { path = "../../editor/editor-egui", optional = true }
