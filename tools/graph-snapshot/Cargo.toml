[package]
name = "graph-snapshot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "graph-snapshot"
path = "src/main.rs"

[dependencies]
# Cross-crate dep on `graph-widgets` (where the production force-layout
# / tree-layout code lives). Same code as the app runs — no
# copy/paste drift — and crossing a crate boundary takes the algorithm
# files out of this binary's `single_call_fn` view.
eframe = { workspace = true }
egui = { workspace = true }
graph-widgets.workspace = true
# Vector-free layout types/builders come from `hiker-graph` directly;
# `graph-widgets` façades only the egui-wrapped position fns.
hiker-graph.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
