[package]
name = "dagre-compare"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dagre-compare"
path = "src/main.rs"

[dependencies]
# The production layered (dagre) layout — the exact engine the mermaid
# renderer drives. We run fixtures through `LayeredEngine` and diff the
# coordinates against real `@dagrejs/dagre` (run in the oracle container),
# so any divergence in the Rust port surfaces as a numeric delta.
hiker-graph.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
