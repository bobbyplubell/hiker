[package]
name = "hiker-canvas"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Egui-agnostic document core of the JSON Canvas (jsoncanvas.org 1.0) editor: the
# serde model, deterministic canonical serialization, egui-free geometry
# (bounds / hit-testing / z-order / edge anchors), and pure invertible edit
# operations. The egui-free view layer (`../view-core`, crate `canvas-view-core`)
# and the egui shell (`../view`, crate `canvas-view`) build on top — this crate
# never depends on egui/emath, the app, or op-log. Mirrors the editor's
# `editor-core` layer. See docs/canvas.md `canvas-crate-split`.

[dependencies]
serde.workspace = true
serde_json.workspace = true
