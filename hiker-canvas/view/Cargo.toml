[package]
name = "canvas-view"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
egui = { workspace = true }
# The egui-free view + interaction layer (camera / edges / handles / hit-testing
# / gesture state / undo). This crate is the thin egui shell over it: painter,
# widget, pointer plumbing, and the `NodeContentRenderer` content seam.
canvas-view-core = { workspace = true }
# The egui-free projection math kernel, so the widget's projection accessors can
# name `ProjectionConfig` (the camera lens math lives in `canvas-view-core`).
hiker-projection = { workspace = true }
# The egui-agnostic JSON Canvas core (document model + `EditOp`s reported back to
# the host). This crate does NOT depend on any content engine (editor-egui /
# hiker-htmlview): node content is painted by a host-supplied trait so it stays
# engine-free.
hiker-canvas = { workspace = true }

[dev-dependencies]
# Headless egui harness to drive `show_static` through a real `Ui` and confirm
# the display-only paint registers no interactive widget. status: canvas-static-paint
# The `wgpu` feature (carried by the workspace dep) also backs the headless
# `projection_snapshot` example, which renders the card-warp PNGs. status: proj-canvas-mode
egui_kittest = { workspace = true }
# Compose the three projection-mode renders into one 3-up comparison PNG (the
# per-mode PNGs are saved via `egui_kittest`'s `image::RgbaImage::save`).
image = "0.25"
