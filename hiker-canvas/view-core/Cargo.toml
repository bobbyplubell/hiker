[package]
name = "canvas-view-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The egui-FREE view + interaction layer of the JSON Canvas editor: the
# pan/zoom camera, cubic-Bézier edge routing, resize/connector handle geometry,
# pointer hit-testing + gesture→`EditOp` decisions, selection, and the in-session
# undo stack. It depends only on `emath` (egui's math types, no rendering) and
# the egui-agnostic `hiker-canvas` core — the analog of the editor's egui-free
# `editor-view` layer. The thin egui shell (`canvas-view`) builds on top.
# See docs/canvas.md `canvas-crate-split`.

[lib]
path = "src/lib.rs"

[dependencies]
emath = { workspace = true }
hiker-canvas = { workspace = true }
# The egui-free projection math kernel (hyperbolic/fisheye lens): `forward` /
# `inverse` / `magnification` over `Complex`, parameterised by `ProjectionConfig`.
# The lens MATH lives here in the egui-free camera; egui paint stays in
# `canvas-view`. See docs/projection.md.
hiker-projection = { workspace = true }
# The view-layer lens shared with the graph-view engine: the locked Poincaré
# disk frame, the forward+nav disk operator (+inverse), the screen↔disk map and
# scroll-zoom. The camera keeps its f64 affine half and frames at f64, routing
# the disk remap through this crate.
hiker-projection-view = { workspace = true }
