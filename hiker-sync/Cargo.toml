[package]
name = "hiker-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Shared workspace deps.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
tracing.workspace = true
# Only the hiker-syncd binary installs a subscriber; already in the workspace
# graph (core + app use it), so this adds no new external dependency.
tracing-subscriber.workspace = true
futures.workspace = true
hiker-core.workspace = true
# tokio: extend the workspace feature set with the networking + multi-thread
# runtime features the eventual libp2p transport (Wave 2) needs.
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }

# --- sync-only deps (confined to this crate per module discipline) ---
# libp2p with the P2P footguns left out: default-features = false plus a
# minimal feature set (no kad / dcutr / relay / autonat). See deny.toml.
# status: sync-libp2p-transport, sync-banned-p2p-features
libp2p = { version = "0.56", default-features = false, features = [
    "tcp",
    "noise",
    "yamux",
    "mdns",
    "request-response",
    "cbor",
    "tokio",
    "macros",
] }
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
blake3 = "1"
bs58 = "0.5"

[[bin]]
name = "hiker-syncd"
path = "src/bin/hiker-syncd.rs"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
