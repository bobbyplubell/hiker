<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>workbench site</title>
    <!-- wasm-opt is run manually in build.sh (needs explicit feature flags
         for the bulk-memory ops modern rustc emits), so disable it here. -->
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="the_canvas_id"></canvas>
  </body>
</html>
