[workspace]
resolver = "2"
members = [
    "core",
    "hiker-sync",
    "hiker-git",
    "hiker-canvas/core",
    "hiker-canvas/view-core",
    "hiker-canvas/view",
    "hiker-llm",
    "hiker-theme",
    "cli",
    "mcp-server",
    "app",
    "zxr",
    "hiker-lite",
    "site",
    "tools/dagre-compare",
    "tools/wavedrom-compare",
    "tools/diff-overlay-snapshot",
    "tools/table-snapshot",
    "tools/graph-snapshot",
    "tools/minimap-render",
    "tools/profile-buffer",
    "tools/profile-canvas",
    "tools/profile-indexer",
    "tools/profile-scroll",
    "widgets/graph-widgets",
    "widgets/graph-view",
    # Generic project-sourcing/binding layer (notes → source descriptors + thin git). Decoupled
    # from code-intel — it's a first-class hiker crate, not part of the engine. status: hiker-projects
    "hiker-projects",
]
# `hiker-crawler` is the JS-capable companion app (docs/hiker-crawler.md),
# excluded because its optional CEF engine links a C++ Chromium FFI binding
# and bundles a multi-hundred-MB CEF distribution, so it must build separately
# (`cd hiker-crawler && cargo run`) and never block the workspace build /
# check.sh. Nothing in the workspace depends on it (crawler-quarantine).
# `editor`, `egui-workbench`, and `hiker-render` are git submodules with their
# own workspace roots (standalone repos). They're consumed here as path
# dependencies via `[workspace.dependencies]`, not as members — listing them
# as members would clash with their nested `[workspace]` (multiple-workspace-
# roots error). `hiker-render` supplies the egui-agnostic graph layout
# (`hiker-graph`, wrapped by `widgets/graph-widgets`) and the from-scratch
# HTML/CSS renderer (`hiker-htmlview`, used by the ZIM viewer). `hiker-charts`
# is the grammar-of-graphics chart engine submodule (its own workspace root +
# nested `[patch.crates-io]` winit fork); consumed here as path deps via
# `[workspace.dependencies]` (hiker-charts-core/-plotters/-gui).
# `code-intel` is the code-intelligence + spec-linking engine (spec-engine + hiker-code +
# hiker-projects + code-cli), kept as a self-contained sub-workspace with its own
# `[workspace]` root — same pattern as the submodule workspaces above. The app consumes its
# UI-free crates as path deps (see `[workspace.dependencies]` below); the UI-coupled graph
# `Source` lands in `app` once the render submodules are present. See
# code-intel/code-intelligence-vision.md + code-intel/hiker-integration-plan.md.
exclude = ["hiker-crawler", "editor", "egui-workbench", "hiker-render", "hiker-charts", "code-intel"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
hiker-core = { path = "core" }
# Code-intelligence + spec-linking engine (the `code-intel/` sub-workspace). UI-free crates the
# app wires in for the code-graph Source + spec linking (hiker-integration-plan.md item G). The
# dependency is one-way: hiker-app → hiker-code/hiker-projects → spec-engine.
spec-engine = { path = "code-intel/spec-engine" }
hiker-code = { path = "code-intel/hiker-code" }
# hiker-projects is a top-level hiker crate (decoupled from code-intel), not under code-intel/.
hiker-projects = { path = "hiker-projects" }
# Grammar-of-graphics chart engine (the `hiker-charts` submodule). Three
# egui-/eframe-free crates: `-core` (spec + CSV typing + resolve + the
# `DataResolver` host seam), `-plotters` (the only plotters consumer; SVG-string
# out), `-gui` (a pure-egui builder panel). The app rasterizes the plotters SVG
# to RGBA via the same resvg path the diagram widgets use. status: chart-render
hiker-charts-core = { path = "hiker-charts/core" }
hiker-charts-plotters = { path = "hiker-charts/backend-plotters" }
hiker-charts-gui = { path = "hiker-charts/gui" }
# Git transport backend (git.md). `git2`/libgit2 is confined to this crate
# (git-backend-trait); consumers see only its plain-Rust `GitBackend` surface.
hiker-git = { path = "hiker-git" }
hiker-canvas = { path = "hiker-canvas/core" }
canvas-view-core = { path = "hiker-canvas/view-core" }
# Shared LLM client extracted from core (status: crawler-shared-llm). Consumed
# by hiker-core AND hiker-crawler so both reach providers through one client.
hiker-llm = { path = "hiker-llm" }
# Shared egui theme extracted from the app (status: crawler-shared-theme) so the
# app and hiker-crawler match colors/fonts/spacing exactly.
hiker-theme = { path = "hiker-theme" }
# Generalized context-menu layer (status: ctxmenu-crate). Pure-egui crate: a menu
# is data (`Menu<A>`) rendered by one shared `show`. Consumed by `hiker-app` and
# `canvas-view`.
hiker-mcp-server = { path = "mcp-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
dhat = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
ulid = "1"
fastembed = "5"
directories = "5"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "fs"] }
notify = "7"
notify-debouncer-full = "0.4"
walkdir = "2"
serde_yml = "0.0.12"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "env-filter"] }
tracing-appender = "0.2"
toml = "0.8"
toml_edit = "0.22"
rmcp = { version = "1.6", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio-util = "0.7"
zstd = "0.13"
llm = { version = "1.3.8", default-features = false, features = ["anthropic", "openai", "ollama", "google", "groq", "mistral", "deepseek", "openrouter", "default-tls"] }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
similar = { version = "2.6", default-features = false, features = ["text"] }
agent-client-protocol = "0.11.1"
# status: cluster-hdbscan-crate-petal
petal-clustering = "0.13"
ndarray = "0.17"
# status: cluster-leiden-crate-single-clustering
# Pinned exactly: upstream is "under heavy development" per its README,
# so any minor bump should be a deliberate re-test rather than a passive
# cargo-update sweep.
single-clustering = "=0.6.1"
# bincode 1.x: serde-driven binary encoding for the `<doc-id>.pending`
# Vec<PendingOp> file (op-log-store-layout). 1.x keeps the serde-derive
# path; 2.x's encode/decode-trait API would mean re-deriving every type.
bincode = "1"

# --- Editor widget (folded from egui_editor; standalone sub-crates) ---
editor-core = { path = "editor/editor-core" }
editor-view = { path = "editor/editor-view" }
editor-egui = { path = "editor/editor-egui" }
editor-md = { path = "editor/editor-md" }
editor-diff = { path = "editor/editor-diff" }
editor-ts = { path = "editor/editor-ts" }
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-sequel = "0.3"

# --- egui ecosystem ---
egui = "0.32"
# egui's math types (Pos2/Rect/Vec2) without any rendering — the only egui-side
# dependency the egui-free `canvas-view-core` needs.
emath = "0.32"
egui_extras = { version = "0.32", features = ["svg", "image"] }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_dock = "0.17"
egui_tiles = { version = "0.13", features = ["serde"] }
egui_workbench = { path = "egui-workbench" }
# Graph layout lives egui-agnostically in the `hiker-render` submodule
# (`hiker-graph`); `widgets/graph-widgets` is the thin egui adapter the app +
# graph-snapshot consume (it converts at the `egui::Vec2` boundary).
hiker-graph = { path = "hiker-render/graph" }
# Egui-free hyperbolic/fisheye projection math kernel (sibling of hiker-graph in
# the render submodule); the graph/canvas view layers consume its Möbius +
# geodesic + lens primitives.
hiker-projection = { path = "hiker-render/projection" }
# Shared render→SVG / syntax-check (`check()`) trait across the diagram engines
# (mermaid / wavedrom / math), in the render submodule. egui-free, no graphics
# deps — the editor/agent seam for syntax-checking diagrams.
hiker-diagram = { path = "hiker-render/diagram" }
# The per-engine `DiagramRenderer` impls (marker types `Mermaid` / `WaveDrom` /
# `Math`) behind the `hiker-diagram` `check()` seam. `hiker-core` dispatches to
# these from `diagram::check_diagram`.
hiker-mermaid = { path = "hiker-render/mermaid" }
hiker-wavedrom = { path = "hiker-render/wavedrom" }
hiker-math = { path = "hiker-render/math" }
graph-widgets = { path = "widgets/graph-widgets" }
# Shared graph-view render engine (force/tree layout, view-options menu,
# node/edge/label/hover/preview paint loop) extracted from the app; consumed
# by hiker-app's two graph panels and the graph-snapshot tool.
hiker-graph-view = { path = "widgets/graph-view" }
# Thin egui shell over the egui-free `canvas-view-core`: the painter + widget +
# pointer plumbing + the `NodeContentRenderer` content seam. Stays free of
# content-engine deps — the app injects those through the trait.
canvas-view = { path = "hiker-canvas/view" }
# From-scratch HTML/CSS renderer (Stylo + our layout + egui paint) in the
# `hiker-render` submodule. Replaces the old `egui-blitz` widget as the ZIM
# viewer's HTML engine; the app talks only to this crate, never Blitz.
hiker-htmlview = { path = "hiker-render/htmlview" }
petgraph = { version = "0.6", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
egui_kittest = { version = "0.32", features = ["snapshot", "wgpu"] }

# --- Editor support crates ---
smallvec = "1.13"
smol_str = "0.3"
proptest = "1.5"
unicode-segmentation = "1.12"
web-time = "1"
regex = "1"

[profile.release]
lto = "thin"

# Optimize dependencies in debug builds so `cargo run` is usable for editor
# work. Without this, egui's tessellator + epaint + our editor crates run
# 10-100x slower than release and scrolling a small file feels laggy even
# though there's nothing structurally wrong. App code stays at the default
# debug opt-level (0) so iteration on hiker-app itself is still fast.
# Standard Bevy / egui pattern; cf. https://bevyengine.org/learn/quick-start/getting-started/setup/
[profile.dev.package."*"]
opt-level = 3

# Our own editor crates run on the per-frame hot path (rope, decorations,
# heightmap, wrap, paint). Build them with light optimization in debug
# too — they recompile rarely (mostly when editor work touches them) so
# the compile-time cost is amortized.
[profile.dev.package.editor-core]
opt-level = 3
[profile.dev.package.editor-view]
opt-level = 3
[profile.dev.package.editor-egui]
opt-level = 3
[profile.dev.package.editor-md]
opt-level = 3
[profile.dev.package.editor-diff]
opt-level = 3

[workspace.lints.clippy]
too_many_lines = "deny"

[patch.crates-io]
# Fork of winit 0.30.13 with upstream master's Wayland touchpad pinch cherry-picked
# in (zwp_pointer_gestures_v1 -> WindowEvent::PinchGesture). Released winit 0.30.x
# lacks it and master is 0.31-beta (incompatible with our egui 0.32/0.34 stack, which
# pins winit ^0.30), so a 0.30-based fork is the only version-compatible path.
# egui-winit maps PinchGesture -> zoom, giving canvas pinch-to-zoom for free.
winit = { git = "ssh://git@github.com/bobbyplubell/winit.git", branch = "wayland-pinch-magnify" }
