[workspace]
resolver = "2"
members = ["core", "cli", "mcp-server", "ui/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
hiker-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
pulldown-cmark = { version = "0.12", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
ulid = "1"
fastembed = "4"
directories = "5"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "fs"] }
notify = "7"
notify-debouncer-full = "0.4"
walkdir = "2"
serde_yml = "0.0.12"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
tracing-appender = "0.2"
toml = "0.8"
toml_edit = "0.22"
rmcp = { version = "1.6", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio-util = "0.7"
zstd = "0.13"
llm = { version = "1.3.8", default-features = false, features = ["anthropic", "openai", "ollama", "google", "groq", "mistral", "deepseek", "openrouter", "default-tls"] }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
similar = { version = "2", default-features = false, features = ["text"] }
agent-client-protocol = "0.11.1"
# status: cluster-hdbscan-crate-petal
petal-clustering = "0.13"
ndarray = "0.17"
# status: cluster-leiden-crate-single-clustering
# Pinned exactly: upstream is "under heavy development" per its README,
# so any minor bump should be a deliberate re-test rather than a passive
# cargo-update sweep.
single-clustering = "=0.6.1"
