[workspace]
resolver = "2"
members = ["core", "cli", "mcp-server", "ui/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
hiker-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
