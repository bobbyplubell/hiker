[workspace]
resolver = "2"
members = [
    "core",
    "hiker-sync",
    "hiker-extract",
    "hiker-canvas/core",
    "hiker-canvas/view-core",
    "hiker-canvas/view",
    "hiker-llm",
    "hiker-theme",
    "cli",
    "mcp-server",
    "app",
    "zxr",
    "hiker-features",
    "hiker-lite",
    "site",
    "tools/graph-snapshot",
    "tools/minimap-render",
    "tools/profile-canvas",
    "tools/profile-indexer",
    "tools/profile-scroll",
    "widgets/graph-widgets",
]
# Example plugins compile to wasm32 (cdylib importing `hiker.host_call`), so
# they're excluded from the host workspace build/test/clippy — they're built
# separately with `cargo build --target wasm32-unknown-unknown`. Each carries
# host-target unit tests for its pure logic (run from its own dir).
# `hiker-crawler` is the JS-capable companion app (docs/hiker-crawler.md),
# excluded for the same reason as the wasm `plugins`: its optional CEF engine
# links a C++ Chromium FFI binding and bundles a multi-hundred-MB CEF
# distribution, so it must build separately (`cd hiker-crawler && cargo run`)
# and never block the workspace build / check.sh. Nothing in the workspace
# depends on it (crawler-quarantine).
# `editor`, `egui-workbench`, and `hiker-render` are git submodules with their
# own workspace roots (standalone repos). They're consumed here as path
# dependencies via `[workspace.dependencies]`, not as members — listing them
# as members would clash with their nested `[workspace]` (multiple-workspace-
# roots error). `hiker-render` supplies the egui-agnostic graph layout
# (`hiker-graph`, wrapped by `widgets/graph-widgets`) and the from-scratch
# HTML/CSS renderer (`hiker-htmlview`, used by the ZIM viewer).
exclude = ["plugins", "hiker-crawler", "editor", "egui-workbench", "hiker-render"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
hiker-core = { path = "core" }
hiker-extract = { path = "hiker-extract" }
hiker-canvas = { path = "hiker-canvas/core" }
canvas-view-core = { path = "hiker-canvas/view-core" }
# Shared LLM client extracted from core (status: crawler-shared-llm). Consumed
# by hiker-core AND hiker-crawler so both reach providers through one client.
hiker-llm = { path = "hiker-llm" }
# Shared egui theme extracted from the app (status: crawler-shared-theme) so the
# app and hiker-crawler match colors/fonts/spacing exactly.
hiker-theme = { path = "hiker-theme" }
hiker-mcp-server = { path = "mcp-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
dhat = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
ulid = "1"
fastembed = "5"
directories = "5"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "fs"] }
notify = "7"
notify-debouncer-full = "0.4"
walkdir = "2"
serde_yml = "0.0.12"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "env-filter"] }
tracing-appender = "0.2"
toml = "0.8"
toml_edit = "0.22"
rmcp = { version = "1.6", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio-util = "0.7"
zstd = "0.13"
llm = { version = "1.3.8", default-features = false, features = ["anthropic", "openai", "ollama", "google", "groq", "mistral", "deepseek", "openrouter", "default-tls"] }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
similar = { version = "2.6", default-features = false, features = ["text"] }
agent-client-protocol = "0.11.1"
# status: cluster-hdbscan-crate-petal
petal-clustering = "0.13"
ndarray = "0.17"
# status: cluster-leiden-crate-single-clustering
# Pinned exactly: upstream is "under heavy development" per its README,
# so any minor bump should be a deliberate re-test rather than a passive
# cargo-update sweep.
single-clustering = "=0.6.1"
# status: op-log-yrs-backed
# CRDT substrate for the op log (core::oplog). Confined to that module per
# its module-discipline doc — no yrs types leak past the OpLog boundary.
yrs = "0.26"
# bincode 1.x: serde-driven binary encoding for the `<doc-id>.pending`
# Vec<PendingOp> file (op-log-store-layout). 1.x keeps the serde-derive
# path; 2.x's encode/decode-trait API would mean re-deriving every type.
bincode = "1"
# wasmi: pure-Rust WebAssembly interpreter for the plugin host
# (`plugin-runtime-wasmi`). Chosen over wasmtime deliberately — no JIT /
# Cranelift, a small auditable dependency tree that fits the clean-SBOM
# posture in deny.toml. Confined behind the `WasmEngine` trait so the
# engine is swappable later.
wasmi = "1"

# --- Editor widget (folded from egui_editor; standalone sub-crates) ---
editor-core = { path = "editor/editor-core" }
editor-view = { path = "editor/editor-view" }
editor-egui = { path = "editor/editor-egui" }
editor-md = { path = "editor/editor-md" }
editor-diff = { path = "editor/editor-diff" }
editor-ts = { path = "editor/editor-ts" }
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-sequel = "0.3"

# --- egui ecosystem ---
egui = "0.32"
# egui's math types (Pos2/Rect/Vec2) without any rendering — the only egui-side
# dependency the egui-free `canvas-view-core` needs.
emath = "0.32"
egui_extras = { version = "0.32", features = ["svg", "image"] }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_dock = "0.17"
egui_tiles = { version = "0.13", features = ["serde"] }
egui_workbench = { path = "egui-workbench" }
hiker-features = { path = "hiker-features" }
# Graph layout lives egui-agnostically in the `hiker-render` submodule
# (`hiker-graph`); `widgets/graph-widgets` is the thin egui adapter the app +
# graph-snapshot consume (it converts at the `egui::Vec2` boundary).
hiker-graph = { path = "hiker-render/hiker-render/graph" }
graph-widgets = { path = "widgets/graph-widgets" }
# Thin egui shell over the egui-free `canvas-view-core`: the painter + widget +
# pointer plumbing + the `NodeContentRenderer` content seam. Stays free of
# content-engine deps — the app injects those through the trait.
canvas-view = { path = "hiker-canvas/view" }
# From-scratch HTML/CSS renderer (Stylo + our layout + egui paint) in the
# `hiker-render` submodule. Replaces the old `egui-blitz` widget as the ZIM
# viewer's HTML engine; the app talks only to this crate, never Blitz.
hiker-htmlview = { path = "hiker-render/hiker-render/htmlview" }
petgraph = { version = "0.6", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
egui_kittest = { version = "0.32", features = ["snapshot", "wgpu"] }

# --- Editor support crates ---
smallvec = "1.13"
smol_str = "0.3"
proptest = "1.5"
unicode-segmentation = "1.12"
web-time = "1"
regex = "1"

[profile.release]
lto = "thin"

# Optimize dependencies in debug builds so `cargo run` is usable for editor
# work. Without this, egui's tessellator + epaint + our editor crates run
# 10-100x slower than release and scrolling a small file feels laggy even
# though there's nothing structurally wrong. App code stays at the default
# debug opt-level (0) so iteration on hiker-app itself is still fast.
# Standard Bevy / egui pattern; cf. https://bevyengine.org/learn/quick-start/getting-started/setup/
[profile.dev.package."*"]
opt-level = 3

# Our own editor crates run on the per-frame hot path (rope, decorations,
# heightmap, wrap, paint). Build them with light optimization in debug
# too — they recompile rarely (mostly when editor work touches them) so
# the compile-time cost is amortized.
[profile.dev.package.editor-core]
opt-level = 3
[profile.dev.package.editor-view]
opt-level = 3
[profile.dev.package.editor-egui]
opt-level = 3
[profile.dev.package.editor-md]
opt-level = 3
[profile.dev.package.editor-diff]
opt-level = 3

[workspace.lints.clippy]
too_many_lines = "deny"
