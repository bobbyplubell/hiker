[workspace]
resolver = "2"
members = ["core", "cli", "mcp-server", "ui/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
hiker-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
pulldown-cmark = { version = "0.12", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
ulid = "1"
fastembed = "4"
directories = "5"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "fs"] }
notify = "7"
notify-debouncer-full = "0.4"
walkdir = "2"
serde_yml = "0.0.12"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
tracing-appender = "0.2"
toml = "0.8"
toml_edit = "0.22"
