[package]
name = "hiker-plugin-notes-query"
version = "0.1.0"
edition = "2021"
publish = false

# cdylib → the wasm artifact; rlib → host-target unit tests for the pure logic.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
