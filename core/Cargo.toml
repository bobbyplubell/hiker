[package]
name = "hiker-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
blake3 = "1"
pulldown-cmark.workspace = true
rusqlite.workspace = true
sqlite-vec.workspace = true
ulid.workspace = true
fastembed.workspace = true
directories.workspace = true
tokio.workspace = true
tokio-util.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
walkdir.workspace = true
serde_yml.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
toml.workspace = true
toml_edit.workspace = true
serde_json.workspace = true
zstd.workspace = true
llm.workspace = true
async-trait.workspace = true
futures.workspace = true
similar.workspace = true
agent-client-protocol.workspace = true
petal-clustering.workspace = true
ndarray.workspace = true
single-clustering.workspace = true
ts-rs = { version = "12", optional = true }

[features]
# `ts-export` turns on the `ts-rs` derives on `core::config::*` and unlocks
# the `gen_ts_types` integration test that writes the TS mirror into
# `ui/src/generatedTypes/`. Production builds leave this off so `ts-rs`
# never enters the dependency graph.
ts-export = ["dep:ts-rs"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "fs", "rt-multi-thread"] }
