[package]
name = "hiker-crawler"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
description = "JS-capable companion app for hiker: load a live site, point-and-click the DOM, and emit a crawl-job note, a source-plugin extractor, or a manifest-import directory. See docs/hiker-crawler.md."

# NOTE: this crate is EXCLUDED from the root workspace (see the top-level
# Cargo.toml). It is the home for hiker's "unsafe" web surface — a full
# Chromium with JS, open-web fetching, and (under the `cef` feature) a C++ CEF
# (Chromium Embedded Framework) binding + bundled distribution running multiple
# processes. None of that may enter hiker-core / hiker-extract / hiker-app;
# this crate depends on them, never the reverse (crawler-quarantine).

[[bin]]
name = "hiker-crawler"
path = "src/main.rs"

[features]
# Default builds the egui shell + the `NullEngine` placeholder — runnable today
# with no browser engine in the graph. The emitters and picker model are fully
# exercisable without a live page.
default = []
# Wire the real CEF engine (crawler-cef-engine). Off by default because CEF
# links a C++ Chromium FFI binding and needs its bundled multi-hundred-MB
# distribution staged at build/run time; pin the `cef` crate + distribution and
# add the dependency line below before enabling. Until then this feature gates
# an unimplemented module.
cef = ["dep:cef", "dep:warc"]

[dependencies]
# Shared chrome so the crawler looks/feels like hiker-app (crawler-app-shell).
egui = "0.32"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.32", features = ["svg", "image"] }

# The IDE-style workbench shell (activity bar + side panels + tabbed editor
# groups) shared with hiker-app, so the crawler's chrome matches hiker
# (crawler-app-shell). Path dep into the sibling crate.
egui_workbench = { path = "../egui-workbench" }

# Reuse hiker's extraction pipeline so previews/archives are byte-identical to
# what hiker ingests (crawler-preview-fidelity), and reuse the manifest-import
# writer for the direct-WARC handoff (crawler-direct-warc). Path dep into the
# main workspace; this is the ONLY hiker crate the crawler links, and the edge
# points downward only.
hiker-extract = { path = "../hiker-extract" }

# Shared egui theme so the crawler's colors/fonts/spacing match hiker exactly
# (crawler-shared-theme), not just its layout.
hiker-theme = { path = "../hiker-theme" }

# The shared from-scratch HTML/CSS renderer (`htmlview-render`), in the
# `hiker-render` git submodule's umbrella workspace. The crawler previews a
# captured page through the SAME renderer the vault displays it with, so the
# HTML/CSS rendition is WYSIWYG across the boundary (crawler-shared-render /
# crawler-render-preview). No JS — the page already rendered in CEF; this is the
# static rendition. hiker-render is workspace-excluded like the crawler.
hiker-htmlview = { path = "../hiker-render/hiker-render/htmlview" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
anyhow = "1"
url = "2"
# Pure-Rust WARC assembly for the CEF capture path (crawler-warc-archive): the
# CDP Network tap's responses are written as warcinfo + response records. No C
# deps (chrono/nom/url/uuid only). Default features off — we author records and
# serialize to an in-memory buffer, not gzip files. Optional + gated on `cef`
# since only the CEF engine taps wire responses; the default *release* build
# never links it. Also a dev-dependency (below) so `warc::assemble` is unit-
# tested in the default build without changing that posture.
warc = { version = "0.4", default-features = false, optional = true }

# LLM-assisted source-plugin authoring (crawler-emit-mode). The crawler shares
# hiker's ONE generative client (crawler-shared-llm) rather than rolling its own
# provider layer, and deliberately does NOT depend on hiker-core: the
# ProviderConfig is built from the environment here. `tokio` (rt only) drives a
# current-thread `block_on` since eframe's update loop is synchronous.
hiker-llm = { path = "../hiker-llm" }
tokio = { version = "1", features = ["rt"] }
# Job-note ULIDs (stamped as `hiker.id` so captured children's `hiker.parent`
# matches) and the native save dialog for choosing the crawl-job-note path.
ulid = "1"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }

# --- CEF engine (enable with `--features cef`) -------------------------------
# CEF is linked via the `cef` crate (cef-rs), version-locked to a specific CEF
# distribution its build script downloads/stages (libcef.so + the .pak/locales
# resources) next to the binary at build time. The OSR `OnPaint` BGRA buffer is
# uploaded as an egui texture (no extra GL crate needed; plain CPU OSR). Off by
# default so the default build needs no Chromium distribution.
cef = { version = "148.3.0", optional = true }

[dev-dependencies]
# The WARC assembler (crawler-warc-archive) is gated on `cef` in normal builds,
# but its logic is pure and worth testing in the default build. Listing `warc`
# here makes it available to `#[cfg(test)]` code (see `mod warc` in main.rs,
# compiled under `cef` OR `test`) without linking it into the default binary.
warc = { version = "0.4", default-features = false }

[profile.release]
lto = "thin"
