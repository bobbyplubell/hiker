[package]
name = "hiker-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hiker_mcp"
path = "src/lib.rs"

[dependencies]
hiker-core.workspace = true
# Shared LLM client (extracted from core) for the agent-bridge ToolDef type.
# status: crawler-shared-llm
hiker-llm.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "fs", "net"] }
tokio-util.workspace = true
tracing.workspace = true
time.workspace = true
rmcp.workspace = true
schemars.workspace = true
axum.workspace = true
async-trait.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "fs", "rt-multi-thread", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
