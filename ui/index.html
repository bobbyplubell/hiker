<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiker</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header id="vault-bar">
          <button id="home-btn" class="icon-btn" title="Vault home" aria-label="Vault home">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M2 7l6-5 6 5v6.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7z"/><path d="M6 14.5V9h4v5.5"/></svg>
          </button>
          <button id="pick-vault" class="icon-btn" title="Open vault…" aria-label="Open vault…">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M2 5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5z"/></svg>
          </button>
          <span id="vault-path"></span>
        </header>
        <header id="tree-toolbar">
          <button id="new-note-btn" title="New note">+ New note</button>
          <button id="tree-actions-btn" class="icon-btn" title="Tree actions">…</button>
        </header>
        <div id="sidebar-scroll">
          <div id="tree"></div>
          <div id="trash-bin" class="collapsed">
            <div id="trash-header"><span id="trash-chevron">▸</span> <svg class="trash-icon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 4.5h10"/><path d="M6.5 4.5V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5"/><path d="M4.5 4.5l.6 8.2a1 1 0 0 0 1 .9h3.8a1 1 0 0 0 1-.9l.6-8.2"/><line x1="7" y1="7.2" x2="7" y2="11.8" stroke-width="1"/><line x1="9" y1="7.2" x2="9" y2="11.8" stroke-width="1"/></svg> <span id="trash-label">Trash</span></div>
            <div id="trash-list"></div>
          </div>
        </div>
      </aside>
      <main id="editor-pane">
        <div id="trash-banner" hidden>Trash preview · Restore to edit</div>
        <!-- status: vault-home-recent-activity-detail
             Read-only preview of a changelog snapshot. Populated by
             openSnapshotPreview; click [Restore] to write this version
             back to disk, [Close] to return to the activity detail. -->
        <div id="snapshot-banner" hidden>
          <span id="snapshot-banner-text">Snapshot preview</span>
          <span class="snapshot-banner-actions">
            <button id="snapshot-banner-restore" class="toolbar-btn" type="button">Restore this version</button>
            <button id="snapshot-banner-close" class="toolbar-btn" type="button">Close preview</button>
          </span>
        </div>
        <header id="editor-toolbar">
          <button id="toggle-sidebar" class="toolbar-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3"/><circle cx="8" cy="8" r="3"/><line x1="8" y1="2" x2="8" y2="5"/><line x1="8" y1="11" x2="8" y2="14"/><line x1="2" y1="8" x2="5" y2="8"/><line x1="11" y1="8" x2="14" y2="8"/><line x1="3.7" y1="3.7" x2="5.9" y2="5.9"/><line x1="10.1" y1="10.1" x2="12.3" y2="12.3"/><line x1="3.7" y1="12.3" x2="5.9" y2="10.1"/><line x1="10.1" y1="5.9" x2="12.3" y2="3.7"/></svg>
          </button>
          <span class="toolbar-spacer"></span>
          <button id="view-menu-btn" class="toolbar-btn" title="View options" aria-label="View options">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>
          </button>
          <button id="mutations-menu-btn" class="toolbar-btn" title="Note mutations" aria-label="Note mutations">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><g transform="rotate(-45 8 8)"><rect x="2" y="7.8" width="12" height="2.4" rx="1.2" stroke-width="0.9"/><rect x="2.4" y="8.2" width="7.2" height="1.6" rx="0.8" fill="currentColor" stroke="none"/></g></svg>
          </button>
          <button id="tree-org-menu-btn" class="toolbar-btn" title="Auto-organize tree" aria-label="Auto-organize tree">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="3.25" r="1.5"/><circle cx="3.5" cy="12.5" r="1.5"/><circle cx="12.5" cy="12.5" r="1.5"/><path d="M8 4.75v2.5"/><path d="M8 7.25H3.5v3.75"/><path d="M8 7.25h4.5v3.75"/></svg>
          </button>
          <button id="trails-menu-btn" class="toolbar-btn" title="Trails" aria-label="Trails">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" overflow="visible" aria-hidden="true"><path stroke-width="2.8" d="M8 15 C 20 12.5, -4 9, 8 7"/><path stroke-width="1.3" d="M8 7 C 13 5.5, 4 3.5, 8 2"/><path stroke-width="0.7" d="M8 2 C 8.8 1.4, 7.5 1, 8 0.5"/></svg>
          </button>
          <button id="toggle-related" class="toolbar-btn" title="Toggle discovery panel" aria-label="Toggle discovery panel">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><line x1="10.2" y1="10.2" x2="14" y2="14"/></svg>
          </button>
        </header>
        <div id="editor"></div>
        <!-- status: vault-home-screen -->
        <div id="vault-home" hidden>
          <!-- status: vault-home-detail-views — overview hosts widget tiles;
               body swaps to a detail view when one is opened. -->
          <div id="vault-home-overview">
            <header class="vault-home-header">
              <h1 id="vault-home-title">Vault</h1>
              <button id="vault-home-new-note" class="toolbar-btn" title="New note in vault root">+ New note</button>
            </header>
            <section id="vault-home-stats" class="vault-home-section">
              <h2>Vault stats</h2>
              <div id="vault-home-stats-body" class="vault-home-stats-grid">
                <div class="vault-home-stat-empty">Loading…</div>
              </div>
            </section>
            <section id="vault-home-modified" class="vault-home-section">
              <h2>Recently modified</h2>
              <ul id="vault-home-modified-list" class="vault-home-list"></ul>
            </section>
            <section id="vault-home-accessed" class="vault-home-section">
              <h2>Recently accessed</h2>
              <ul id="vault-home-accessed-list" class="vault-home-list"></ul>
            </section>
            <!-- status: vault-home-recent-activity-widget -->
            <section id="vault-home-activity" class="vault-home-section" hidden>
              <h2 id="vault-home-activity-header">Recent activity</h2>
              <ul id="vault-home-activity-list" class="vault-home-list"></ul>
            </section>
          </div>
          <!-- status: vault-home-recent-activity-detail -->
          <div id="vault-home-detail" hidden>
            <header class="vault-home-header">
              <h1 id="vault-home-detail-title">Recent activity</h1>
              <span id="vault-home-detail-count" class="vault-home-detail-count"></span>
            </header>
            <div id="vault-home-detail-filters" class="vault-home-filters"></div>
            <ul id="vault-home-detail-list" class="vault-home-activity-detail-list"></ul>
          </div>
        </div>
        <footer id="status-bar">
          <div id="status-left">
            <button id="save-btn" disabled>Save</button>
            <span id="status-path"></span>
          </div>
          <div id="status-center">
            <span id="status-index"></span>
          </div>
          <div id="status-right">
            <span id="status-cursor">1:1</span>
            <span id="status-words">0 words</span>
            <span class="badge">md</span>
          </div>
        </footer>
      </main>
      <!-- status: search-discovery-panel -->
      <!-- Right panel = Discovery: search-results + related-notes as
           collapsible sections under a fixed input row. The legacy
           #related-list / .related-* classes are kept inside the related
           section so existing JS rendering paths still work. -->
      <aside id="discovery" class="collapsed">
        <header id="discovery-bar">
          <input
            id="search-input"
            type="text"
            placeholder="Search vault…"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="search-clear-btn" class="icon-btn" title="Clear search" hidden>✕</button>
          <!-- status: search-mode-toggles -->
          <button id="toggle-mode-semantic" class="toolbar-btn active" title="Semantic search" aria-label="Semantic search">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M8 2.4c-1.4-.9-3.3-.4-3.9 1-1.3.1-2.1 1.3-1.7 2.4-.7.7-.6 1.9.2 2.4-.4.8 0 1.9 1 2.2.1 1.2 1.3 2 2.5 1.7.5.7 1.5.9 2.2.4"/><path d="M8 2.4c1.4-.9 3.3-.4 3.9 1 1.3.1 2.1 1.3 1.7 2.4.7.7.6 1.9-.2 2.4.4.8 0 1.9-1 2.2-.1 1.2-1.3 2-2.5 1.7-.5.7-1.5.9-2.2.4"/><path d="M8 2.7v11"/><path d="M5.2 4.6c.5.3.6 1 .2 1.5"/><path d="M3.7 6.9c.6.1 1 .7.8 1.3"/><path d="M4.2 9.3c.6-.1 1.2.3 1.3.9"/><path d="M6.4 11c.5-.3 1.2-.1 1.5.4"/><path d="M10.8 4.6c-.5.3-.6 1-.2 1.5"/><path d="M12.3 6.9c-.6.1-1 .7-.8 1.3"/><path d="M11.8 9.3c-.6-.1-1.2.3-1.3.9"/><path d="M9.6 11c-.5-.3-1.2-.1-1.5.4"/></svg>
          </button>
          <button id="toggle-mode-lexical" class="toolbar-btn active" title="Lexical search" aria-label="Lexical search">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M1.5 12.5L4.5 3.5h1.5l3 9"/><path d="M2.7 9.5h5.1"/><path d="M14.5 12.5V7.8a2 2 0 0 0-2-2 2 2 0 0 0-2 2v4.7"/><path d="M10.5 10h4"/></svg>
          </button>
        </header>
        <div id="discovery-sections">
          <!-- status: search-empty-collapses-results
               Section is hidden via [hidden] when query is empty. -->
          <section id="search-section" class="discovery-section" hidden>
            <header class="discovery-section-header">
              <span class="discovery-chevron">▾</span>
              <span class="discovery-section-title">Search results</span>
              <span id="search-count" class="discovery-section-count"></span>
              <span id="search-spinner" class="discovery-section-spinner" hidden>…</span>
            </header>
            <div id="search-list" class="discovery-section-body"></div>
          </section>
          <section id="related-section" class="discovery-section">
            <header class="discovery-section-header">
              <span class="discovery-chevron">▾</span>
              <span class="discovery-section-title">Related notes</span>
              <span id="related-count" class="discovery-section-count"></span>
            </header>
            <div id="related-list" class="discovery-section-body"></div>
          </section>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
