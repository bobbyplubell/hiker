<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiker</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header id="vault-bar">
          <button id="pick-vault">Open vault…</button>
          <span id="vault-path"></span>
        </header>
        <header id="tree-toolbar">
          <button id="new-note-btn" title="New note">+ New note</button>
          <button id="tree-actions-btn" class="icon-btn" title="Tree actions">…</button>
        </header>
        <div id="tree"></div>
        <div id="trash-bin" class="collapsed">
          <div id="trash-header"><span id="trash-chevron">▸</span> <span id="trash-label">🗑 Trash</span></div>
          <div id="trash-list"></div>
        </div>
      </aside>
      <main id="editor-pane">
        <div id="trash-banner" hidden>Trash preview · Restore to edit</div>
        <header id="editor-toolbar">
          <button id="toggle-sidebar" class="toolbar-btn" title="Toggle file tree">☰</button>
          <span class="toolbar-spacer"></span>
          <button id="view-menu-btn" class="toolbar-btn" title="View options">View ▾</button>
          <button id="toggle-related" class="toolbar-btn" title="Toggle related notes">⊕</button>
        </header>
        <div id="editor"></div>
        <footer id="status-bar">
          <div id="status-left">
            <button id="save-btn" disabled>Save</button>
            <span id="status-path"></span>
          </div>
          <div id="status-center">
            <span id="status-index"></span>
          </div>
          <div id="status-right">
            <span id="status-cursor">1:1</span>
            <span id="status-words">0 words</span>
            <span class="badge">md</span>
          </div>
        </footer>
      </main>
      <aside id="related" class="collapsed">
        <header id="related-header">Related</header>
        <div id="related-list"></div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
