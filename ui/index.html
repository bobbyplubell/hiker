<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiker</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header id="vault-bar">
          <button id="pick-vault">Open vault…</button>
          <span id="vault-path"></span>
        </header>
        <div id="tree"></div>
      </aside>
      <main id="editor-pane">
        <div id="editor"></div>
        <footer id="status-bar">
          <div id="status-left">
            <button id="save-btn" disabled>Save</button>
            <span id="status-path"></span>
          </div>
          <div id="status-center"></div>
          <div id="status-right">
            <span id="status-cursor">1:1</span>
            <span id="status-words">0 words</span>
            <span class="badge">md</span>
          </div>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
