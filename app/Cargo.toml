[package]
name = "hiker-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hiker"
path = "src/main.rs"

# Library facade over the app's module tree, consumed by tools/profile-buffer to
# drive the real decoration-rebuild path. Root lives at `app/lib.rs` (outside
# `src/`, via `#[path]`) so the repo's structural lint scripts — which scan
# `app/src` — don't treat it as a new module-root for the bin's files. The bin
# above is unaffected.
[lib]
name = "hiker_app"
path = "lib.rs"

[features]
default = []
# Puffin profiler. Turns on the `profile_function!` / `profile_scope!`
# markers sprinkled through hot paths and spawns a `puffin_http` server
# on 127.0.0.1:8585 at startup. View the live flame graph with
# `puffin_viewer` (install once with `cargo install puffin_viewer`) and
# connect to that address. Off by default — keeps release builds clean.
# Build with `cargo run --features profiling`.
#
# We use `puffin_http` rather than `puffin_egui` because puffin_egui is
# tightly coupled to a specific egui version that doesn't match the one
# eframe pulls in. External-viewer also gives a better experience —
# the profiler UI doesn't fight the app being profiled for frame budget.
profiling = ["dep:puffin", "dep:puffin_http"]

[dependencies]
hiker-core.workspace = true
# Shared LLM client (extracted from core); the chat + cluster-summary paths
# build a GraniteLlmClient via core's config bridge. status: crawler-shared-llm
hiker-llm.workspace = true
# Git transport backend; `git2`/libgit2 is confined to `hiker-git` — the app
# sees only its plain-Rust `GitBackend` surface. status: git-backend-trait
hiker-git.workspace = true
puffin = { version = "0.19", optional = true, features = ["serialization"] }
puffin_http = { version = "0.16", optional = true }

# UI
hiker-theme.workspace = true
# Generalized context-menu layer (status: ctxmenu-crate). Declared ready for the
# menu-adoption phase; not yet used.
egui.workspace = true
egui_extras.workspace = true
egui_workbench = { workspace = true, features = ["serde"] }
graph-widgets.workspace = true
hiker-graph-view.workspace = true
# Code-intelligence: the code-graph panel binds a project note's repo source
# (hiker-projects) to the SCIP adapter (hiker-code) and renders its entity graph
# through hiker-graph-view. One-way dep: app → hiker-code/hiker-projects → spec-engine.
spec-engine.workspace = true
hiker-code.workspace = true
hiker-projects.workspace = true
# JSON Canvas editor: the egui-agnostic core (`hiker-canvas`), the egui-free
# view layer (`canvas-view-core`, for `CreateKind` and friends), and the egui
# shell (`canvas-view`). The canvas panel glues them to the op-log + tab spine;
# node content is injected through `canvas_view`'s `NodeContentRenderer` seam.
# status: canvas-tab
hiker-canvas.workspace = true
canvas-view-core.workspace = true
canvas-view.workspace = true
# The egui-free projection math kernel, so the canvas View menu can name
# `ProjectionKind` for the Off/Fisheye/Poincaré selector. [proj-canvas-mode]
hiker-projection.workspace = true
# The view-layer lens (disk frame, disk operator, centroid framing) — lets the
# canvas overview drop its hand-copied `centroid_scale`/`disk_point`.
hiker-projection-view.workspace = true
# Vector-free layout types (`LayoutParams`, `LayoutKind`, `LayoutTree`, the
# tree builders) come from here directly; `graph-widgets` façades only the
# egui-wrapped pieces (the project bans `pub use` re-exports).
hiker-graph.workspace = true
# HTML/CSS rendering for the ZIM viewer tab — the from-scratch `hiker-htmlview`
# renderer (Stylo + our layout + egui paint) from the `hiker-render` submodule.
# The app drives it directly (host owns scroll/clip/input). status: zim-view
hiker-htmlview = { workspace = true }
# Pure-Rust .zim archive reader (+ full-text Xapian search) feeding the ZIM
# viewer. The `zxr` git submodule. status: zim-view
zxr = { path = "../zxr" }
# Editor-widget renderers from the `hiker-render` submodule: egui-agnostic
# LaTeX math (`hiker-math`), mermaid (`hiker-mermaid`), and WaveDrom
# (`hiker-wavedrom`), all SVG-string out. The app rasterizes their SVG to RGBA
# via resvg (same path `hiker-htmlview` uses) in panels/buffer/widgets/render.rs.
# status: widget-render-pipeline, widget-wavedrom-render
hiker-math = { path = "../hiker-render/math" }
hiker-mermaid = { path = "../hiker-render/mermaid" }
hiker-wavedrom = { path = "../hiker-render/wavedrom" }
# Shared diagram `Diagnostic` / `Severity` types behind the `check()` seam. The
# editor squiggle layer (panels/buffer/widgets/mod.rs) maps these onto the
# editor's decoration diagnostics. status: diagram-editor-diagnostics
hiker-diagram = { path = "../hiker-render/diagram" }
# Grammar-of-graphics charts (the `hiker-charts` submodule): `-core` (spec +
# CSV typing + resolve + `DataResolver` host seam), `-plotters` (SVG-string
# renderer), `-gui` (pure-egui builder panel). Inline ```chart blocks render
# through the same resvg SVG→RGBA path as mermaid (panels/buffer/widgets), and
# a `.csv` opens the builder in its own tab. status: chart-render
hiker-charts-core.workspace = true
hiker-charts-plotters.workspace = true
hiker-charts-gui.workspace = true
# SVG → RGBA rasterization (usvg parse + tiny-skia pixmap). Same version
# `hiker-htmlview` already pulls in, so the dep set stays consistent.
resvg = "0.47.0"
# Image decode/encode. PNG drives the persisted diagram-cache layer
# (panels/buffer/widgets/disk_cache.rs); the other web formats decode an
# `![alt](path)` image hosted in a table cell (panels/buffer/widgets/tables/
# image.rs). status: widget-render-disk-cache / widget-table-render
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
eframe.workspace = true
petgraph.workspace = true
rfd.workspace = true

# MCP runtime
hiker-mcp-server.workspace = true

# Editor widget
editor-core.workspace = true
editor-view.workspace = true
editor-egui.workspace = true
editor-md.workspace = true
editor-diff.workspace = true
# Code syntax highlighting for read-only code buffers (`code-syntax-highlight`).
editor-ts = { workspace = true, features = ["lang-rust", "lang-python"] }

# Async + runtime
tokio = { workspace = true, features = ["rt-multi-thread", "rt", "sync", "macros", "time", "fs"] }
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true

# Data
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
directories.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

# Misc
notify.workspace = true
walkdir.workspace = true
ulid.workspace = true
smol_str.workspace = true
time.workspace = true
similar.workspace = true
regex.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
# egui_kittest activates `egui/accesskit`, which adds an `accesskit_update`
# field to `PlatformOutput`. egui-winit's destructure of that struct gates
# the same field on its own `accesskit` feature. Without unifying the two,
# the test build fails to compile egui-winit. Same workaround as
# `editor/editor-egui/Cargo.toml`.
egui-winit = { version = "0.32", features = ["accesskit"] }
tempfile = "3"
