[package]
name = "hiker-graph-view"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
egui = { workspace = true }
# Layout kinds + tree types (LayoutKind/LayoutTree/LayoutParams).
hiker-graph = { workspace = true }
# Shared theme colors used by the view-options menu + styles.
hiker-theme = { workspace = true }
# The egui adapter over the layout engines (force worker + tree positions).
graph-widgets = { workspace = true }
# The egui-free lens kernel (forward/inverse/magnification + geodesic sampling).
hiker-projection = { workspace = true }
# The view-layer lens over the kernel: the locked Poincaré disk frame, the
# forward+nav disk operator, the screen↔disk map, scroll-zoom and centroid
# framing — shared with the canvas camera.
hiker-projection-view = { workspace = true }
# Custom instanced GPU paint path (node fills + edge lines) that bypasses egui's
# CPU tessellation under the wgpu backend. Gated OFF unless the live app opts in.
egui-wgpu = "0.32"
wgpu = "25"
bytemuck = { version = "1", features = ["derive"] }
# Optional profiling spans around the GPU batch build + upload, mirroring the
# app's `profiling` feature. Zero-cost (compiled out) when the feature is off.
puffin = { version = "0.19", optional = true }

[features]
# Enable `puffin` profile spans in the GPU paint path. Turn on alongside the
# app's own `profiling` feature so these spans show up in the same capture.
profiling = ["dep:puffin"]

[dev-dependencies]
egui_kittest = { version = "0.32", features = ["snapshot", "wgpu"] }
eframe = { version = "0.32", features = ["glow", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# The code-intelligence adapter, for the `code_graph_snapshot` example: it proves a real
# `ScipAdapter` → `CodeGraph` renders through this engine's `Source` trait headlessly.
hiker-code = { workspace = true }
spec-engine = { workspace = true }
